name: Hata bildirimi
description: Tekrar üretilebilir bir problem bildirin.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Ne oldu ve ne olmasını bekliyordunuz?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Tekrar üretme adımları
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ortam
      description: İşletim sistemi, tarayıcı ve Node.js sürümü
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Kontrol
      options:
        - label: Hassas veri veya güvenlik açığı paylaşmadım.
          required: true
